<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PayDod</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Cairo', sans-serif; }</style>
</head>
<body class="bg-slate-950 text-white min-h-screen flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 w-full max-w-md shadow-2xl space-y-6">
        <div class="text-center space-y-1">
            <h1 class="text-3xl font-bold bg-gradient-to-r from-blue-400 to-indigo-500 bg-clip-text text-transparent">PayDod</h1>
            <p class="text-slate-400 text-sm">محاكي المندوب - إنشاء رابط الدفع</p>
        </div>
        <form id="f" class="space-y-4">
            <input type="text" id="o" required placeholder="رقم الطلب (#1001)" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white">
            <input type="number" id="a" required placeholder="المبلغ (جنيه)" step="0.01" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white">
            <button type="submit" id="b" class="w-full bg-blue-600 hover:bg-blue-500 font-semibold p-3 rounded-xl transition">إنشاء رابط الدفع والـ QR</button>
        </form>
        <div id="r" class="hidden space-y-4 pt-4 border-t border-slate-800 text-center">
            <div class="bg-white p-3 rounded-xl inline-block" id="q"></div>
            <input type="text" id="u" readonly class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2 text-xs text-slate-400">
        </div>
    </div>
    <script>
        const f=document.getElementById('f'),b=document.getElementById('b'),r=document.getElementById('r'),q=document.getElementById('q'),u=document.getElementById('u');
        f.addEventListener('submit',async(e)=>{
            e.preventDefault();b.disabled=true;b.innerText='جاري الإنشاء...';
            try{
                const res=await fetch('/api/payment-sessions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({order_id:document.getElementById('o').value,amount:document.getElementById('a').value})});
                const d=await res.json();
                if(res.ok&&d.checkout_url){q.innerHTML='';new QRCode(q,{text:d.checkout_url,width:160,height:160});u.value=d.checkout_url;r.classList.remove('hidden');}
                else{alert(d.error||'خطأ');}
            }catch(e){alert('Connection Error');}
            finally{b.disabled=false;b.innerText='إنشاء رابط الدفع والـ QR';}
        });
    </script>
</body>
</html>
