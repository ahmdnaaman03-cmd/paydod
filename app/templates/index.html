<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlTag">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PayDOD - Dynamic QR Payment</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #0b0f19; }
        .gradient-text { background: linear-gradient(135deg, #a855f7 0%, #3b82f6 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .gradient-btn { background: linear-gradient(135deg, #8b5cf6 0%, #3b82f6 100%); }
    </style>
</head>
<body class="text-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-[#111827] border border-slate-800/80 rounded-3xl p-6 shadow-2xl relative overflow-hidden">
        <div class="flex justify-between items-center mb-6">
            <button onclick="toggleLanguage()" id="langBtn" class="text-xs bg-slate-800 hover:bg-slate-700 text-blue-400 font-semibold px-3 py-1.5 rounded-xl border border-slate-700 transition">
                English
            </button>
        </div>
        <div class="text-center mb-8">
            <h1 class="text-4xl font-black tracking-tight mb-2">
                Pay<span class="gradient-text">DOD</span>
            </h1>
            <p id="subTitle" class="text-slate-400 text-xs font-medium">
                تحويل الدفع عند التسليم إلى دفع رقمي فوري
            </p>
        </div>
        <form id="paymentForm" class="space-y-4">
            <div>
                <label id="lblOrder" class="block text-xs font-medium text-slate-400 mb-1">رقم الطلب (Order ID)</label>
                <input type="text" id="orderName" value="1001" required class="w-full bg-[#0b0f19] border border-slate-800 rounded-2xl px-4 py-3 text-white text-center text-sm focus:outline-none focus:border-blue-500 transition">
            </div>
            <div>
                <label id="lblAmount" class="block text-xs font-medium text-slate-400 mb-1">المبلغ المطلوب</label>
                <input type="number" step="0.01" id="amount" value="150" required class="w-full bg-[#0b0f19] border border-slate-800 rounded-2xl px-4 py-3 text-white text-center text-sm focus:outline-none focus:border-blue-500 transition">
            </div>
            <input type="hidden" id="currency" value="USD">
            <button type="submit" id="submitBtn" class="w-full gradient-btn hover:opacity-95 text-white font-bold py-3.5 rounded-2xl transition shadow-lg shadow-indigo-500/20 text-sm mt-2">
                إنشاء رابط الدفع
            </button>
        </form>
        <div id="resultBox" class="hidden mt-6 pt-6 border-t border-slate-800/80 space-y-4 text-center">
            <div class="bg-white p-3 rounded-2xl inline-block shadow-lg">
                <img id="qrImage" src="" alt="Dynamic QR Code" class="w-40 h-40 mx-auto">
            </div>
            <div>
                <a id="checkoutLink" href="#" target="_blank" class="text-xs text-blue-400 underline break-all block font-mono"></a>
            </div>
        </div>
    </div>
    <script>
        let currentLang = 'ar';
        const i18n = {
            ar: { subTitle: 'تحويل الدفع عند التسليم إلى دفع رقمي فوري', lblOrder: 'رقم الطلب (Order ID)', lblAmount: 'المبلغ المطلوب', btnSubmit: 'إنشاء رابط الدفع', btnLoading: 'جاري الإنشاء...', langBtn: 'English' },
            en: { subTitle: 'Converting Cash-on-Delivery into Instant Digital Payments', lblOrder: 'Order ID', lblAmount: 'Required Amount', btnSubmit: 'Create Payment Link', btnLoading: 'Creating...', langBtn: 'عربي' }
        };
        function toggleLanguage() {
            currentLang = currentLang === 'ar' ? 'en' : 'ar';
            document.getElementById('htmlTag').dir = currentLang === 'ar' ? 'rtl' : 'ltr';
            const t = i18n[currentLang];
            document.getElementById('subTitle').innerText = t.subTitle;
            document.getElementById('lblOrder').innerText = t.lblOrder;
            document.getElementById('lblAmount').innerText = t.lblAmount;
            document.getElementById('submitBtn').innerText = t.btnSubmit;
            document.getElementById('langBtn').innerText = t.langBtn;
        }
        document.getElementById('paymentForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn'), box = document.getElementById('resultBox');
            btn.disabled = true; btn.innerText = i18n[currentLang].btnLoading; box.classList.add('hidden');
            try {
                const res = await fetch('/api/payment-sessions', {
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        shopify_order_name: document.getElementById('orderName').value, 
                        shipment_id: 'SH-' + Date.now(), 
                        amount: parseFloat(document.getElementById('amount').value), 
                        currency: document.getElementById('currency').value 
                    })
                });
                const data = await res.json();
                if (res.ok) { 
                    document.getElementById('qrImage').src = data.qr_url; 
                    const a = document.getElementById('checkoutLink'); 
                    a.href = data.checkout_url; 
                    a.innerText = data.checkout_url; 
                    box.classList.remove('hidden'); 
                } else {
                    alert('Error: ' + (data.error || 'Failed'));
                }
            } catch (err) { 
                alert('Connection error'); 
            } finally { 
                btn.disabled = false; 
                btn.innerText = i18n[currentLang].btnSubmit; 
            }
        });
    </script>
</body>
</html>
