<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlPage">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PayDOD - Create Payment / إنشاء طلب دفع</title>
    <style>
        :root { --bg: #070a14; --card: rgba(15, 23, 42, 0.85); --border: rgba(255, 255, 255, 0.1); --purple: #8b5cf6; --cyan: #00d4ff; }
        body { margin: 0; padding: 20px; font-family: system-ui, sans-serif; background: var(--bg); color: #fff; min-height: 100vh; display: flex; justify-content: center; align-items: center; }
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 28px; width: 100%; max-width: 420px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); backdrop-filter: blur(12px); position: relative; }
        .lang-btn { position: absolute; top: 16px; left: 16px; background: rgba(255,255,255,0.1); border: 1px solid var(--border); color: var(--cyan); padding: 4px 10px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: bold; }
        html[dir="ltr"] .lang-btn { left: auto; right: 16px; }
        .brand { font-size: 32px; font-weight: 800; text-align: center; margin-bottom: 4px; }
        .brand span.gradient { background: linear-gradient(135deg, var(--purple), var(--cyan)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .tagline { font-size: 11px; color: #94a3b8; text-align: center; margin-bottom: 24px; }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 13px; color: #94a3b8; margin-bottom: 6px; }
        input { width: 100%; padding: 12px; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border); border-radius: 8px; color: #fff; font-size: 14px; box-sizing: border-box; outline: none; }
        button.submit-btn { width: 100%; padding: 14px; background: linear-gradient(135deg, var(--purple), #3b82f6); color: #fff; border: none; border-radius: 8px; font-size: 15px; font-weight: 700; cursor: pointer; }
        #result { margin-top: 18px; padding: 12px; background: rgba(255, 255, 255, 0.03); border: 1px solid var(--border); border-radius: 8px; word-break: break-all; display: none; font-size: 13px; }
        #result a { color: var(--cyan); text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <button class="lang-btn" onclick="toggleLang()">English</button>
        <div class="brand">Pay<span class="gradient">DOD</span></div>
        <div class="tagline">Converting Cash-on-Delivery into Instant Digital Payments</div>
        
        <form id="paymentForm">
            <div class="form-group">
                <label id="lbl_order">رقم الطلب (Order ID)</label>
                <input type="text" id="order_id" required placeholder="1001">
            </div>
            <div class="form-group">
                <label id="lbl_amount">المبلغ المطلوب</label>
                <input type="number" step="0.01" id="amount" required placeholder="150">
            </div>
            <div class="form-group">
                <label id="lbl_curr">العملة</label>
                <input type="text" id="currency" value="USD" required>
            </div>
            <button type="submit" class="submit-btn" id="btn_submit">إنشاء رابط الدفع</button>
        </form>
        <div id="result"></div>
    </div>
    <script>
        let currentLang = 'ar';
        const t = {
            ar: { btnLang: 'English', lblOrder: 'رقم الطلب (Order ID)', lblAmount: 'المبلغ المطلوب', lblCurr: 'العملة', btnSubmit: 'إنشاء رابط الدفع', creating: 'جاري الإنشاء...', successMsg: 'رابط الدفع:' },
            en: { btnLang: 'عربي', lblOrder: 'Order ID', lblAmount: 'Amount', lblCurr: 'Currency', btnSubmit: 'Create Payment Link', creating: 'Creating...', successMsg: 'Payment Link:' }
        };

        function toggleLang() {
            currentLang = currentLang === 'ar' ? 'en' : 'ar';
            const html = document.getElementById('htmlPage');
            html.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
            html.lang = currentLang;
            
            document.querySelector('.lang-btn').innerText = t[currentLang].btnLang;
            document.getElementById('lbl_order').innerText = t[currentLang].lblOrder;
            document.getElementById('lbl_amount').innerText = t[currentLang].lblAmount;
            document.getElementById('lbl_curr').innerText = t[currentLang].lblCurr;
            document.getElementById('btn_submit').innerText = t[currentLang].btnSubmit;
        }

        document.getElementById('paymentForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn_submit');
            btn.innerText = t[currentLang].creating;
            btn.disabled = true;
            try {
                const res = await fetch('/api/create-payment', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        amount: parseFloat(document.getElementById('amount').value),
                        currency: document.getElementById('currency').value,
                        order_id: document.getElementById('order_id').value
                    })
                });
                const data = await res.json();
                const resultDiv = document.getElementById('result');
                resultDiv.style.display = 'block';
                if (res.ok) {
                    resultDiv.innerHTML = `<strong>${t[currentLang].successMsg}</strong><br><br><a href="${data.payment_url}" target="_blank">${data.payment_url}</a>`;
                } else {
                    resultDiv.innerHTML = `<span style="color:#ef4444;">Error: ${data.error || 'Failed'}</span>`;
                }
            } catch(err) {
                alert('Connection Error');
            } finally {
                btn.innerText = t[currentLang].btnSubmit;
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
